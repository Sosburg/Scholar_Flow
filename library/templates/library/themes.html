{% extends 'base.html' %}{% block content %}<div class="page-header"><div><h2>Themes</h2><p class="muted">Create reusable tags for synthesis.</p></div></div><div class="two-col"><div class="card"><h3>Create theme</h3><form method="post" class="stack">{% csrf_token %}{{ form.as_p }}<button class="button">Create theme</button></form></div><div class="card"><h3>Current themes</h3><div class="list">{% for theme in themes %}<div class="list-row"><div class="theme-name"><span class="dot" style="background: {{ theme.color }}"></span><strong>{{ theme.name }}</strong></div><form method="post" action="{% url 'delete_theme' theme.id %}">{% csrf_token %}<button class="button danger">Delete</button></form></div>{% empty %}<p class="muted">No themes yet.</p>{% endfor %}</div></div></div>{% endblock %}
